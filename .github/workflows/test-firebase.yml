
name: Test Pocket Docket Firebase

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reminder-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --omit=dev

      
      - name: Check Google Cloud authentication
        run: |
          echo "Expected service account: ${{ vars.GCP_SERVICE_ACCOUNT }}"
          echo "Expected project: pocket-docket-82820"
          echo "Credential file present:"
          if [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Yes"
          else
            echo "No"
            exit 1
          fi

      - name: Test Firestore connection
        run: node test-firebase.mjs

