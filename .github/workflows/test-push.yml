
name: Test Pocket Docket iPhone Push

on:
  workflow_dispatch:
    inputs:
      subscription_id:
        description: 'Firestore pushSubscriptions document ID'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reminder-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Send one test notification
        run: node test-push.mjs
        env:
          TEST_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
